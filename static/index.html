<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Darukaa.Earth — Biodiversity Intelligence Chatbot</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --green-dark: #1f3d2b;
    --green: #2f6b3f;
    --green-light: #e8f3ea;
    --tan: #f6f3ea;
    --text: #22291f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--tan); color: var(--text);
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    background: var(--green-dark); color: white; padding: 16px 24px;
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: 0.8; }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px; max-width: 820px; margin: 0 auto; width: 100%;
  }
  .msg { margin-bottom: 18px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 75%; padding: 12px 16px; border-radius: 14px; white-space: pre-wrap; line-height: 1.5; font-size: 14.5px;
  }
  .msg.user .bubble { background: var(--green); color: white; border-bottom-right-radius: 2px; }
  .msg.bot .bubble { background: white; border: 1px solid #ddd; border-bottom-left-radius: 2px; }
  .meta { font-size: 11px; color: #6b6b6b; margin-top: 6px; }
  #inputbar {
    display: flex; gap: 8px; padding: 16px; max-width: 820px; margin: 0 auto; width: 100%;
  }
  #inputbar textarea {
    flex: 1; resize: none; padding: 10px 14px; border-radius: 10px; border: 1px solid #ccc; font-size: 14px; height: 46px;
  }
  #inputbar button {
    background: var(--green); color: white; border: none; padding: 0 20px; border-radius: 10px; cursor: pointer; font-size: 14px;
  }
  #inputbar button:hover { background: var(--green-dark); }
  .known { font-size: 12px; color: var(--green-dark); background: var(--green-light); padding: 6px 10px; border-radius: 8px; margin: 0 auto 8px; max-width: 820px; }
</style>
</head>
<body>
<header>
  <h1>🌱 Darukaa.Earth — Biodiversity Intelligence Chatbot</h1>
  <p>Ask about soil, land use, climate, or biodiversity conditions on your land.</p>
</header>
<div id="known" class="known" style="display:none;"></div>
<div id="chat"></div>
<div id="inputbar">
  <textarea id="input" placeholder="e.g. Biodiversity is declining on my land, semi-arid region, monoculture wheat..."></textarea>
  <button id="send">Send</button>
</div>

<script>
let sessionId = null;
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const knownEl = document.getElementById('known');

function addMessage(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
}

async function send() {
  const message = inputEl.value.trim();
  if (!message) return;
  addMessage('user', message);
  inputEl.value = '';

  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId, message })
  });
  const data = await res.json();
  sessionId = data.session_id;
  addMessage('bot', data.reply);

  const metrics = Object.entries(data.known_metrics);
  if (metrics.length) {
    knownEl.style.display = 'block';
    knownEl.textContent = 'Known metrics: ' + metrics.map(([k, v]) => `${k}=${v}`).join(', ');
  }
}

document.getElementById('send').addEventListener('click', send);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

addMessage('bot', "Hi! I'm the Darukaa biodiversity assistant. Tell me about a piece of land — soil, rainfall, land use, or species observations — and I'll give you evidence-backed recommendations.");
</script>
</body>
</html>
